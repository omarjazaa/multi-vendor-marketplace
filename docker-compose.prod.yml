services:
  nginx:
    image: nginx:1.27-alpine
    container_name: marketplace_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - default

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: marketplace_prod_app
    restart: always
    expose:
      - "9000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SERVER_MODE: fpm
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-marketplace}
      DB_USERNAME: ${DB_USERNAME:-marketplace}
      DB_PASSWORD: ${DB_PASSWORD:-marketplace}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: marketplace_prod_queue
    restart: always
    command: ["entrypoint.sh", "queue"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-marketplace}
      DB_USERNAME: ${DB_USERNAME:-marketplace}
      DB_PASSWORD: ${DB_PASSWORD:-marketplace}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: marketplace_prod_scheduler
    restart: always
    command: ["entrypoint.sh", "scheduler"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-marketplace}
      DB_USERNAME: ${DB_USERNAME:-marketplace}
      DB_PASSWORD: ${DB_PASSWORD:-marketplace}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default

  mysql:
    image: mysql:8.4
    container_name: marketplace_prod_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-marketplace}
      MYSQL_USER: ${DB_USERNAME:-marketplace}
      MYSQL_PASSWORD: ${DB_PASSWORD:-marketplace}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_strong_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          - db
          - mysql

  redis:
    image: redis:7-alpine
    container_name: marketplace_prod_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local
  app_public:
    driver: local
