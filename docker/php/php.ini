[PHP]
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60
max_input_time = 60
date.timezone = UTC
expose_php = Off

; Error handling & logging
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Performance & session
variables_order = "GPCS"
request_order = "GP"
session.gc_maxlifetime = 7200
